<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호빈이 머리카락 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#bfe8f5;
    --sky-bottom:#eaf7ee;
    --grass:#4c9f70;
    --grass-dark:#356e4d;
    --sun:#f4b740;
    --ink:#22352a;
    --card:#ffffff;
    --line:#d8ece0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Gowun Dodum', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 55%, #ffffff 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  h1{
    font-family:'Jua', sans-serif;
    font-size:clamp(28px,5vw,42px);
    color:var(--grass-dark);
    margin:0 0 6px;
    text-shadow:2px 2px 0 rgba(255,255,255,0.6);
  }
  .subtitle{
    margin:0 0 22px;
    font-size:15px;
    color:#3f5c4c;
    text-align:center;
    max-width:520px;
    line-height:1.6;
  }
  .layout{
    display:flex;
    gap:22px;
    align-items:flex-start;
    width:100%;
    max-width:980px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .stage-card{
    background:var(--card);
    border-radius:22px;
    padding:14px;
    box-shadow:0 14px 30px rgba(53,110,77,0.18);
    border:3px solid var(--line);
  }
  #stage{
    display:block;
    width:min(560px,88vw);
    height:auto;
    aspect-ratio:4/3;
    border-radius:14px;
    cursor:crosshair;
    background:#fff9f0;
    touch-action:none;
  }
  .panel{
    width:280px;
    background:var(--card);
    border-radius:22px;
    padding:18px 18px 20px;
    box-shadow:0 14px 30px rgba(53,110,77,0.12);
    border:3px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .section-label{
    font-family:'Jua', sans-serif;
    font-size:15px;
    color:var(--grass-dark);
    margin:0 0 8px;
  }
  .row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .mode-btn{
    flex:1;
    padding:9px 6px;
    border-radius:14px;
    border:2px solid var(--line);
    background:#f6fbf8;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
    transition:transform .12s ease, background .15s ease;
  }
  .mode-btn.active{
    background:var(--grass);
    border-color:var(--grass-dark);
    color:#fff;
    transform:translateY(-1px);
  }
  .swatch{
    width:30px;height:30px;border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .swatch.active{
    border-color:var(--sun);
    box-shadow:0 0 0 2px var(--grass-dark);
  }
  .style-btn{
    flex:1;
    padding:8px 4px;
    border-radius:12px;
    border:2px solid var(--line);
    background:#f6fbf8;
    font-size:13px;
    cursor:pointer;
    font-family:'Gowun Dodum', sans-serif;
  }
  .style-btn.active{
    background:#fff4de;
    border-color:var(--sun);
  }
  .bg-btn{
    flex:1 1 auto;
    padding:8px 6px;
    border-radius:12px;
    border:2px solid var(--line);
    background:#f6fbf8;
    font-size:13px;
    cursor:pointer;
    font-family:'Gowun Dodum', sans-serif;
  }
  .bg-btn.active{
    background:#e7f3ff;
    border-color:#4a90d9;
  }
  input[type="range"]{
    width:100%;
    accent-color:var(--grass);
  }
  .action-btn{
    width:100%;
    padding:10px;
    border-radius:14px;
    border:none;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    cursor:pointer;
    color:#fff;
    background:var(--grass);
  }
  .action-btn.water{ background:#4a90d9; }
  .action-btn.reset{ background:#c1440e; }
  .file-label{
    display:block;
    width:100%;
    padding:10px;
    border-radius:14px;
    border:2px dashed var(--grass);
    text-align:center;
    font-size:13.5px;
    cursor:pointer;
    color:var(--grass-dark);
    background:#f2fbf6;
  }
  .file-label input{ display:none; }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
  }
  .hint{
    font-size:12.5px;
    color:#6c8578;
    line-height:1.5;
    margin:0;
  }

/* 팝업 모달 스타일 */
  .popup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .popup-card {
    background: #ffffff;
    width: min(340px, 85vw);
    padding: 24px 20px;
    border-radius: 20px;
    border: 3px solid var(--line);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    position: relative;
  }
  .popup-close {
    position: absolute;
    top: 12px; right: 16px;
    background: none;
    border: none;
    font-size: 22px;
    font-weight: bold;
    color: #888;
    cursor: pointer;
    line-height: 1;
  }
  .popup-close:hover { color: var(--ink); }
  .popup-title {
    font-family: 'Jua', sans-serif;
    font-size: 20px;
    color: var(--grass-dark);
    margin: 0 0 14px;
    border-bottom: 2px dashed var(--line);
    padding-bottom: 8px;
  }
  .popup-list {
    margin: 0;
    padding-left: 18px;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.7;
  }
</style>
</head>
<body>

  < NOTICE 팝업 >
  <div class="popup-overlay" id="noticePopup">
    <div class="popup-card">
      <button class="popup-close" id="popupCloseBtn">&times;</button>
      <h2 class="popup-title">NOTICE</h2>
      <ul class="popup-list">
        <li>오류 수정: 머리 자르면 다시 자라지 않음</li>
        <li>배경 이미지 생김</li>
        <li>게임 시작 시 '자른 후에도 다시 자라기' 기본 해제</li>
      </ul>
    </div>
  </div>
  <h1>호빈이 머리카락 키우기</h1>
  <p class="subtitle">브러시로 쓱 문질러 머리카락을 심어보세요! 가위로 선을 그어 닿은 부분을 잘라보세요!</p>

  <div class="layout">
    <div class="stage-card">
      <canvas id="stage" width="800" height="600"></canvas>
    </div>

    <div class="panel">
      <div>
        <p class="section-label">🏠 배경</p>
        <div class="row">
          <button class="bg-btn active" data-bg="salon">미용실</button>
          <button class="bg-btn" data-bg="sky">하늘</button>
          <button class="bg-btn" data-bg="studio">스튜디오</button>
        </div>
      </div>

      <div>
        <p class="section-label">📷 사진</p>
        <label class="file-label">
          내 사진으로 바꾸기
          <input type="file" id="photoInput" accept="image/*">
        </label>
      </div>

      <div>
        <p class="section-label">✏️ 도구</p>
        <div class="row">
          <button class="mode-btn active" id="brushModeBtn">브러시</button>
          <button class="mode-btn" id="scissorModeBtn">가위</button>
        </div>
      </div>

      <div>
        <p class="section-label">🎨 머리 색</p>
        <div class="row" id="colorRow"></div>
      </div>

      <div>
        <p class="section-label">〰️ 스타일</p>
        <div class="row">
          <button class="style-btn active" data-style="straight">직모</button>
          <button class="style-btn" data-style="wavy">웨이브</button>
          <button class="style-btn" data-style="curly">곱슬</button>
        </div>
      </div>

      <div>
        <p class="section-label">🌱 자라는 속도</p>
        <input type="range" id="growthSpeed" min="1" max="10" value="4">
      </div>

      <div class="toggle-row">
        <input type="checkbox" id="regrowToggle">
        <label for="regrowToggle">자른 후에도 다시 자라기</label>
      </div>

      <button class="action-btn water" id="waterBtn">탈모약💊</button>
      <button class="action-btn reset" id="resetBtn">↺ 머리카락 초기화</button>

      <p class="hint"><b>브러시:</b> 캔버스를 드래그하면 연속으로 머리카락이 여러 개 심어집니다.<br><b>가위:</b> 자르고 싶은 경로를 쓱 그으면, 선에 닿은 머리카락이 그 지점에서 잘립니다.</p>
    </div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  let bgMode = 'salon';
  let curMode = 'brush';
  let curColor = '#222222';
  let curStyle = 'straight';
  let growthSpeed = 4;
  let regrow = document.getElementById('regrowToggle').checked;

  let isDrawing = false;
  let lastPos = null;
  let cutPath = [];

  // 배경 이미지 경로 설정
  const BACKGROUNDS = {
    salon: "salon.png",
    sky: "sky.png",
    studio: "studio.png"
  };

  let bgImage = new Image();
  bgImage.src = BACKGROUNDS.salon;

  // Hair Strand Data Structure
  let hairs = [];

  const COLORS = ['#222222', '#5d3a1a', '#e8b84d', '#cc3333', '#8844aa', '#4488cc', '#ffffff'];

  // Color Swatches
  const colorRow = document.getElementById('colorRow');
  COLORS.forEach((c, idx)=>{
    const b = document.createElement('button');
    b.className = 'swatch' + (idx===0?' active':'');
    b.style.background = c;
    if(c==='#ffffff') b.style.border = '2px solid #ccc';
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      b.classList.add('active');
      curColor = c;
    });
    colorRow.appendChild(b);
  });

  // Photo Upload (기본 캐릭터 beeen.png)
  let userImage = new Image();
  userImage.src = "beeen.png"; 

  document.getElementById('photoInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = (evt)=>{
        userImage = new Image();
        userImage.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  // UI Event Listeners
  document.querySelectorAll('.bg-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.bg-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      bgMode = b.dataset.bg;
      if (BACKGROUNDS[bgMode]) {
        bgImage.src = BACKGROUNDS[bgMode];
      }
    });
  });

  document.getElementById('brushModeBtn').addEventListener('click', ()=>{
    curMode = 'brush';
    document.getElementById('brushModeBtn').classList.add('active');
    document.getElementById('scissorModeBtn').classList.remove('active');
    canvas.style.cursor = 'crosshair';
  });

  document.getElementById('scissorModeBtn').addEventListener('click', ()=>{
    curMode = 'scissor';
    document.getElementById('scissorModeBtn').classList.add('active');
    document.getElementById('brushModeBtn').classList.remove('active');
    canvas.style.cursor = 'pointer';
  });

  document.querySelectorAll('.style-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.style-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      curStyle = b.dataset.style;
    });
  });

  document.getElementById('growthSpeed').addEventListener('input', (e)=>{
    growthSpeed = parseInt(e.target.value);
  });

  document.getElementById('regrowToggle').addEventListener('change', (e)=>{
    regrow = e.target.checked;
  });

  document.getElementById('waterBtn').addEventListener('click', ()=>{
    const orig = growthSpeed;
    growthSpeed = Math.min(15, growthSpeed * 2.5);
    setTimeout(()=> growthSpeed = orig, 2500);
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    hairs = [];
  });

  // Canvas Coordinates Helper
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height)
    };
  }

  // Plant single hair root
  function plantHair(x, y){
    hairs.push({
      root: {x, y},
      nodes: [{x, y}],
      color: curColor,
      style: curStyle,
      isGrowing: true,
      phase: Math.random() * Math.PI * 2
    });
  }

  // Plant multiple hairs along continuous drag line
  function plantHairsAlongLine(p1, p2){
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const step = 6;
    const count = Math.max(1, Math.floor(dist / step));
    for(let i=0; i<count; i++){
      const t = i / count;
      const x = p1.x + (p2.x - p1.x)*t + (Math.random()-0.5)*4;
      const y = p1.y + (p2.y - p1.y)*t + (Math.random()-0.5)*4;
      plantHair(x, y);
    }
  }

  // Pointer Events
  function onPointerDown(e){
    isDrawing = true;
    const pos = getPos(e);
    lastPos = pos;
    if(curMode === 'scissor'){
      cutPath = [pos];
    } else {
      plantHair(pos.x, pos.y);
    }
  }

  function onPointerMove(e){
    if(!isDrawing) return;
    const pos = getPos(e);

    if(curMode === 'brush'){
      plantHairsAlongLine(lastPos, pos);
      lastPos = pos;
    } else if(curMode === 'scissor'){
      cutPath.push(pos);
      checkAndCutHairLine(lastPos, pos);
      lastPos = pos;
    }
  }

  function onPointerUp(){
    isDrawing = false;
    cutPath = [];
  }

  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); onPointerDown(e); }, {passive:false});
  canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); onPointerMove(e); }, {passive:false});
  canvas.addEventListener('touchend', onPointerUp);

  // Line Intersection Helper
  function lineIntersects(p1, p2, p3, p4){
    function ccw(A, B, C){
      return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
    }
    return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
  }

  // Cut hair at intersection point
  function checkAndCutHairLine(p1, p2){
    hairs.forEach(hair => {
      if(hair.nodes.length < 2) return;
      for(let i = 0; i < hair.nodes.length - 1; i++){
        const n1 = hair.nodes[i];
        const n2 = hair.nodes[i+1];
        if(lineIntersects(p1, p2, n1, n2)){
          hair.nodes = hair.nodes.slice(0, i + 1);
          if(!regrow){
            hair.isGrowing = false;
          }
          break;
        }
      }
    });
  }

  // Draw Background
  function drawBackground(){
    ctx.clearRect(0, 0, W, H);

    // 배경 사진 파일이 로드되었으면 사진을 그리고, 없으면 기본 색상 출력
    if (bgImage.complete && bgImage.naturalWidth > 0) {
      ctx.drawImage(bgImage, 0, 0, W, H);
    } else {
      if(bgMode === 'salon'){
        const grad = ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0, '#f2ece4');
        grad.addColorStop(1, '#dfd5c6');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,W,H);
      } else if(bgMode === 'sky'){
        const grad = ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0, '#a1c4fd');
        grad.addColorStop(1, '#c2e9fb');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,W,H);
      } else {
        ctx.fillStyle = '#3a3d40';
        ctx.fillRect(0,0,W,H);
      }
    }

    // Draw Character / Photo (beeen.png)
    if(userImage.complete && userImage.naturalWidth > 0){
      const scale = Math.min(W / userImage.width, (H - 80) / userImage.height) * 0.8;
      const iw = userImage.width * scale;
      const ih = userImage.height * scale;
      const ix = (W - iw)/2;
      const iy = H - ih - 20;
      ctx.drawImage(userImage, ix, iy, iw, ih);
    }
  }

  // Update Hair Growth
  function updateHairs(){
    if(growthSpeed === 0) return;

    const gravity = 0.35 * (growthSpeed / 4);

    hairs.forEach(hair => {
      if(!hair.isGrowing) return;

      const lastNode = hair.nodes[hair.nodes.length - 1];
      
      let dx = 0;
      let dy = (1.2 * growthSpeed / 4) + gravity;

      if(hair.style === 'wavy'){
        dx = Math.sin(hair.nodes.length * 0.4 + hair.phase) * 1.8;
      } else if(hair.style === 'curly'){
        dx = Math.cos(hair.nodes.length * 0.8 + hair.phase) * 3.2;
      } else {
        dx = (Math.random() - 0.5) * 0.5;
      }

      const nextNode = {
        x: lastNode.x + dx,
        y: lastNode.y + dy
      };

      if(hair.nodes.length < 180){
        hair.nodes.push(nextNode);
      }
    });
  }

  // Render Hairs & Cut Line
  function draw(){
    drawBackground();

    // Render Hairs
    hairs.forEach(hair => {
      if(hair.nodes.length < 2) return;

      ctx.beginPath();
      ctx.strokeStyle = hair.color;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.moveTo(hair.nodes[0].x, hair.nodes[0].y);
      for(let i = 1; i < hair.nodes.length; i++){
        ctx.lineTo(hair.nodes[i].x, hair.nodes[i].y);
      }
      ctx.stroke();
    });

    // Render Cut Line
    if(curMode === 'scissor' && cutPath.length > 1){
      ctx.beginPath();
      ctx.strokeStyle = '#c1440e';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.moveTo(cutPath[0].x, cutPath[0].y);
      for(let i = 1; i < cutPath.length; i++){
        ctx.lineTo(cutPath[i].x, cutPath[i].y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Main Loop
  function loop(){
    updateHairs();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
